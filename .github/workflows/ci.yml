name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

  parser:
    name: Parser lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/parser
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/parser/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

  frontend:
    name: Frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare Nuxt
        run: npm run postinstall

      - name: ESLint
        run: npx eslint .

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [backend, parser, frontend]
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Build site
        working-directory: services/frontend
        env:
          # same as the server image: IPv6 lookups have broken font downloads
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          npm ci
          # font downloads from Google/Fontshare fail now and then: retry
          for i in 1 2 3; do npm run build && break; [ $i = 3 ] && exit 1; sleep 20; done
          tar -czf ../../frontend-output.tgz .output

      - name: Upload site build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: frontend-output.tgz
          target: /tmp/tenderoptima-deploy

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            rm -rf services/frontend/prebuilt
            mkdir -p services/frontend/prebuilt
            tar -xzf /tmp/tenderoptima-deploy/frontend-output.tgz -C services/frontend/prebuilt
            rm -f /tmp/tenderoptima-deploy/frontend-output.tgz
            docker compose up -d --build
